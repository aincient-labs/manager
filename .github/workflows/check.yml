# Compiles the workspace on every OS a release builds for, on every push and
# pull request — so a platform-specific break (a `cfg(unix)` module used from
# cross-platform code, say) fails HERE, on a branch, and never on a public tag.
# `bin/release-manager publish` (umbrella repo) waits for this workflow to pass
# on the release commit before it tags.
#
# The Tauri GUI (`atelier-manager`) is excluded: on Linux it needs GTK/WebKit
# system packages, and release-gui.yml builds it on every tag anyway. Tests,
# clippy and the RustSec advisories check run once, on ubuntu-22.04; the other
# runners only compile.
name: Check

on:
  push:
    branches:
      - '**'
  pull_request:

permissions:
  contents: read

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-22.04
          - ubuntu-22.04-arm
          - macos-15
          - windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable
          components: clippy

      - name: Cache cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: cargo check
        run: cargo check --workspace --exclude atelier-manager --locked

      - name: cargo test
        if: matrix.os == 'ubuntu-22.04'
        run: cargo test --workspace --exclude atelier-manager --locked

      - name: cargo clippy
        if: matrix.os == 'ubuntu-22.04'
        run: cargo clippy --workspace --exclude atelier-manager --all-targets --locked -- -D warnings

      # RustSec advisories against Cargo.lock (deny.toml; umbrella DECISIONS 0503/0504). The
      # whole lockfile is checked, the GUI's crates included.
      - name: Install cargo-deny
        if: matrix.os == 'ubuntu-22.04'
        uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2
        with:
          tool: cargo-deny@0.20.2

      - name: cargo deny check advisories
        if: matrix.os == 'ubuntu-22.04'
        run: cargo deny --locked check advisories

  # Real-Docker scenario tests (umbrella DECISIONS 0528): every incident in code
  # that changes the owner's Docker, reproduced on a tiny real compose project.
  # Linux runners ship Docker + compose; macOS runners have none, and the
  # owner's Mac covers OrbStack/Docker Desktop.
  scenarios:
    name: scenarios (real Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          toolchain: stable

      - name: Cache cargo
        uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      - name: Docker
        run: docker version && docker compose version

      - name: cargo test --test scenarios
        run: cargo test -p aincient-core --test scenarios --locked -- --ignored --test-threads=1

      # A cancelled or timed-out run never reaches the harness's own cleanup
      # (Drop), and the next run's sweep is on another runner. Remove what it
      # left: every `atelier-scn-*` compose project, image tag and site dir,
      # and the images the harness built (label atelier.scn.pid). Nothing
      # else on the runner is touched.
      - name: Remove scenario leftovers
        if: always()
        run: |
          projects=$( {
            docker ps -a --filter label=com.docker.compose.project --format '{{.Label "com.docker.compose.project"}}'
            docker volume ls --filter label=com.docker.compose.project --format '{{.Label "com.docker.compose.project"}}'
            docker network ls --filter label=com.docker.compose.project --format '{{.Label "com.docker.compose.project"}}'
          } | grep '^atelier-scn-' | sort -u || true)
          for p in $projects; do
            echo "removing project $p"
            docker compose -p "$p" down -v --remove-orphans -t 2 || true
          done
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'atelier-scn-' | xargs -r docker image rm || true
          docker image ls -a -q --filter label=atelier.scn.pid | sort -u | xargs -r docker image rm || true
          tmp="${TMPDIR:-/tmp}"
          for d in "$tmp"/atelier-scn-*; do
            [ -e "$d" ] || continue
            chmod -R u+w "$d" || true
            rm -rf "$d"
          done
          echo "left behind:"
          docker ps -a --filter name=atelier-scn- --format '{{.Names}}'
          docker image ls --format '{{.Repository}}:{{.Tag}}' | grep 'atelier-scn-' || true
