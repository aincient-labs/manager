[package]
name = "aincient-core"
description = "Lifecycle engine for an Atelier CMS appliance — shared by the atelier CLI and the Tauri manager."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs = "5"
getrandom = "0.2"
# Verifies a downloaded remote engine against its release `.sha256` (M2).
sha2 = "0.11"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# sites.toml — the multi-site registry (DECISIONS 0393). Already in the lock via Tauri.
toml = "0.9"
# The Manager's HTTPS client for the engine sidecar's API (m3-3, m7-4): small,
# blocking, rustls with the webpki roots (no "accept invalid certs" knob is
# ever set). Optional, so the engine server crate never links it; the CLI and
# the GUI turn it on. ~3.2: 3.3+ needs rustc 1.85, above our MSRV.
ureq = { version = "~3.2", default-features = false, features = ["rustls"], optional = true }

# The per-site operation lock (`oplock`): the OS's own file lock, released
# when the holder's process dies. Both already in the lock file (Tauri, keyring).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

[features]
# The engine client's real HTTPS transport (`engine_client::Https`).
engine-client = ["dep:ureq"]
# Test-only seams for the real-Docker scenarios (`stack::scenario_seams`). Only
# this crate's own tests turn it on, through the dev-dependency on itself below.
scenario-seams = []

# Guided per-server SSH keys live in the OS keychain, never on disk (M2, D-05).
# keyring 3.x: 4.x needs rustc 1.88, above our MSRV. On Linux the pure-Rust zbus
# Secret Service backend, so the binary (which is also the server-side engine)
# never links libdbus.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3.6", features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6", features = ["async-secret-service", "async-io", "crypto-rust"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3.6", features = ["windows-native"] }

[dev-dependencies]
socket2 = "0.6"
# Itself, with the scenario seams on: for its tests only, never the CLI or app.
aincient-core = { path = ".", features = ["scenario-seams"] }
